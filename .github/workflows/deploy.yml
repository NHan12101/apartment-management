name: CI/CD Pipeline - Apartment Management

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout source code
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Setup Go
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    # 3. Setup Node.js
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # 4. Build Backend Go Binary
    - name: Build Backend
      run: |
        if [ -d "backend" ]; then cd backend; fi
        go mod tidy || true
        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o main .

    # 5. Build Frontend React
    - name: Build Frontend
      run: |
        if [ -d "frontend" ]; then cd frontend; fi
        npm install
        npm run build

    # 6. Deploy files to VPS
    - name: Deploy to VPS
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        password: ${{ secrets.VPS_PASSWORD }}
        port: ${{ secrets.VPS_PORT }}
        source: "**/main,**/dist/*"
        target: "/var/www/phongtro_temp"

    # 7. Restart App on VPS (Đã fix PATH cho PM2)
    - name: Restart Application on VPS
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        password: ${{ secrets.VPS_PASSWORD }}
        port: ${{ secrets.VPS_PORT }}
        script: |
          # Nạp đường dẫn PATH chứa pm2, node, npm
          export PATH=$PATH:/usr/local/bin:/usr/bin:/bin:~/.nvm/versions/node/$(node -v 2>/dev/null)/bin

          # 1. Move Frontend
          mkdir -p /var/www/phongtro/frontend/dist
          DIST_PATH=$(find /var/www/phongtro_temp -type d -name "dist" | head -n 1)
          if [ -n "$DIST_PATH" ]; then
            cp -r $DIST_PATH/* /var/www/phongtro/frontend/dist/
          fi
          
          # 2. Move Backend
          mkdir -p /var/www/phongtro/backend
          MAIN_PATH=$(find /var/www/phongtro_temp -type f -name "main" | head -n 1)
          if [ -n "$MAIN_PATH" ]; then
            cp $MAIN_PATH /var/www/phongtro/backend/
          fi
          
          cd /var/www/phongtro/backend
          chmod +x main
          
          # 3. Khởi chạy / Restart bằng PM2
          pm2 restart phongtro-api || pm2 start ./main --name "phongtro-api" --env MONGO_URI="mongodb://apartment_user:MatKhauDoiData2026!@localhost:27017/apartment_management?authSource=apartment_management"
          pm2 save

          # 4. Dọn dẹp folder tạm
          rm -rf /var/www/phongtro_temp

    # 8. Notify Telegram
    - name: Notify Telegram Success
      if: success()
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        message: |
          ✅ Deploy Sản Phẩm Thành Công!
          • Repository: ${{ github.repository }}
          • Commit: ${{ github.event.head_commit.message }}
          • Website: https://phongtro.thanhnhan.food

    - name: Notify Telegram Failure
      if: failure()
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        message: |
          ❌ Deploy Thất Bại!
          • Repository: ${{ github.repository }}
          • Commit: ${{ github.event.head_commit.message }}